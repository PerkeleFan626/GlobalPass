<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | GlobalPass</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a href="index.html" class="logo">Global<span>Pass</span></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main class="container section">
    <form class="form-card" id="register-form" novalidate>
      <h1>Create an account</h1>
      <p class="form-sub">Already have one? <a href="login.html">Log in</a></p>

      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password <small>(min 6 characters)</small></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

      <label for="role">I am a...</label>
      <select id="role" name="role" required>
        <option value="bidder">Bidder (bid on auctions)</option>
        <option value="government">Government official (list citizenship)</option>
      </select>

      <div id="country-field" hidden>
        <label for="country">Country you represent</label>
        <input id="country" name="country" type="text" maxlength="80" autocomplete="off" list="country-list" placeholder="Start typing, then pick from the list">
        <datalist id="country-list"></datalist>
      </div>

      <p class="form-msg" id="msg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Create account</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 GlobalPass · All rights reserved A &amp; S · <a href="about.html">About &amp; contact</a></div>
  </footer>

  <script type="module">
    import './js/ui.js';
    import { signUpUser } from './database--seb/signUp.js';
    import { redirectIfLoggedIn, HOME_BY_ROLE } from './js/auth.js';
    import { fillCountryList, checkCountry } from './js/countries.js';

    fillCountryList('country-list');

    redirectIfLoggedIn();

    const form = document.getElementById('register-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');
    const countryField = document.getElementById('country-field');

    function show(text, ok = false) {
      msg.textContent = text;
      msg.className = 'form-msg ' + (ok ? 'ok' : 'error');
    }

    // only government accounts need a country
    form.role.addEventListener('change', () => {
      countryField.hidden = form.role.value !== 'government';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      const role = form.role.value;
      const country = form.country.value.trim();

      if (!name || !email || !password) return show('Please fill in every field.');
      if (password.length < 6) return show('Password must be at least 6 characters.');
      if (role === 'government') {
        const check = checkCountry(country);
        if (!check.success) return show(check.error);
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      // the backend function creates the login and the profile
      const result = await signUpUser({ email, password, name, represented_country: country, role });

      btn.disabled = false;
      btn.textContent = 'Create account';

      if (!result.success) return show(result.error);
      if (!result.session) return show('Account created. Check your email to confirm, then log in.', true);

      show('Account created! Redirecting...', true);
      setTimeout(() => (window.location.href = HOME_BY_ROLE[role]), 800);
    });
  </script>
</body>
</html>
