<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — GlobalPass</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a href="index.html" class="logo">Global<span>Pass</span></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main class="container section">
    <form class="form-card" id="register-form" novalidate>
      <h1>Create an account</h1>
      <p class="form-sub">Already have one? <a href="login.html">Log in</a></p>

      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password <small>(min 8 characters)</small></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

      <label for="role">I am a…</label>
      <select id="role" name="role" required>
        <option value="bidder">Bidder — I want to bid on auctions</option>
        <option value="government">Government official — I want to list citizenship</option>
      </select>

      <p class="form-msg" id="msg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Create account</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 GlobalPass · All rights reserved A &amp; S</div>
  </footer>

  <script type="module" src="js/ui.js"></script>
  <script type="module">
    import { supabase } from './js/supabase.js';
    import { redirectIfLoggedIn, HOME_BY_ROLE } from './js/auth.js';

    redirectIfLoggedIn();

    const form = document.getElementById('register-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    function show(text, ok = false) {
      msg.textContent = text;
      msg.className = 'form-msg ' + (ok ? 'ok' : 'error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      const role = form.role.value;

      if (!name || !email || !password) return show('Please fill in every field.');
      if (password.length < 8) return show('Password must be at least 8 characters.');

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      // name + role are passed as metadata; the database trigger copies them into profiles
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { name, role } },
      });

      btn.disabled = false;
      btn.textContent = 'Create account';

      if (error) return show(error.message);
      if (!data.session) return show('Account created. Check your email to confirm, then log in.', true);

      show('Account created! Redirecting…', true);
      setTimeout(() => (window.location.href = HOME_BY_ROLE[role]), 800);
    });
  </script>
</body>
</html>
