<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | GlobalPass</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a href="index.html" class="logo">Global<span>Pass</span></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main class="container section">
    <form class="form-card" id="forgot-form" novalidate>
      <h1>Forgot your password?</h1>
      <p class="form-sub">Enter your email and we will send you a link to set a new one.</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <p class="form-msg" id="msg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Send reset link</button>
      <p class="form-foot"><a href="login.html">Back to log in</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 GlobalPass · All rights reserved A &amp; S · <a href="about.html">About</a> · <a href="contact.html">Contact</a></div>
  </footer>

  <script type="module">
    import './js/ui.js';
    import './js/auth.js';
    import { requestPasswordReset } from './database--seb/password.js';

    const form = document.getElementById('forgot-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if (!email) {
        msg.textContent = 'Enter your email.';
        msg.className = 'form-msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      const result = await requestPasswordReset(email);
      btn.disabled = false;
      btn.textContent = 'Send reset link';

      if (!result.success) {
        msg.textContent = result.error;
        msg.className = 'form-msg error';
        return;
      }
      // same message if the email exists or not, so nobody can check who has an account
      msg.textContent = 'If that email has an account, a reset link is on its way.';
      msg.className = 'form-msg ok';
      form.reset();
    });
  </script>
</body>
</html>
