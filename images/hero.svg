<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="A passport in front of a globe with a rising bid line" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8f62"/>
      <stop offset="1" stop-color="#14553c"/>
    </linearGradient>
  </defs>
  <!-- globe -->
  <g fill="none" stroke="#2a3140" stroke-width="3">
    <circle cx="300" cy="200" r="170"/>
    <ellipse cx="300" cy="200" rx="75" ry="170"/>
    <ellipse cx="300" cy="200" rx="135" ry="170"/>
    <path d="M130 200h340M150 120h300M150 280h300"/>
  </g>
  <!-- bid line going up -->
  <path d="M60 330l80-40 60 20 80-70 70 20 110-110" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#3ecf8e">
    <circle cx="140" cy="290" r="7"/><circle cx="200" cy="310" r="7"/><circle cx="280" cy="240" r="7"/>
    <circle cx="350" cy="260" r="7"/><circle cx="460" cy="150" r="9"/>
  </g>
  <!-- passport -->
  <g transform="rotate(-8 190 210)">
    <rect x="100" y="90" width="180" height="240" rx="14" fill="url(#cover)" stroke="#3ecf8e" stroke-width="2"/>
    <g fill="none" stroke="#e8ecf2" stroke-width="3">
      <circle cx="190" cy="185" r="42"/>
      <ellipse cx="190" cy="185" rx="18" ry="42"/>
      <path d="M148 185h84M156 162h68M156 208h68"/>
    </g>
    <rect x="135" y="255" width="110" height="10" rx="5" fill="#e8ecf2"/>
    <rect x="155" y="278" width="70" height="8" rx="4" fill="#e8ecf2" opacity="0.6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
