<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auction | GlobalPass</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a href="index.html" class="logo">Global<span>Pass</span></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main class="container section">
    <div class="section-head" style="margin-bottom:0">
      <a href="auctions.html" class="back-link">← All auctions</a>
      <span class="live-badge" id="live-badge">○ Connecting...</span>
    </div>
    <div id="content"><div class="skeleton"></div></div>
  </main>

  <!-- bid popup -->
  <dialog class="modal" id="bid-modal" aria-labelledby="bid-title">
    <form id="bid-form" novalidate>
      <h2 id="bid-title">Place a bid</h2>
      <p class="form-sub" id="bid-min"></p>
      <label for="bid-amount" class="visually-hidden">Bid amount (NZD)</label>
      <input id="bid-amount" type="number" inputmode="numeric" step="1" required>
      <div class="quick" id="quick"></div>
      <p class="form-msg" id="bid-msg" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="bid-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="bid-submit">Confirm bid</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <div class="container">© 2026 GlobalPass · All rights reserved A &amp; S · <a href="about.html">About &amp; contact</a></div>
  </footer>

  <script type="module">
    import { getAuction, getBids, minNextBid, currentPrice, placeBid, isOpen, shownStatus } from './js/api.js';
    import { getProfile } from './js/auth.js';
    import { formatNZD, esc, countdownText, startCountdowns } from './js/ui.js';
    import { flagUrl, countryLabel } from './js/countries.js';
    import { subscribeAuction, flash } from './js/realtime.js';

    const id = new URLSearchParams(location.search).get('id');
    const content = document.getElementById('content');
    const modal = document.getElementById('bid-modal');
    const form = document.getElementById('bid-form');
    const amountInput = document.getElementById('bid-amount');
    const bidMsg = document.getElementById('bid-msg');
    const submitBtn = document.getElementById('bid-submit');

    let auction = null;
    let bids = [];
    let profile = null;
    let lastPrice = null;

    // the box on the right: price, time left and the bid button
    function bidPanel() {
      const price = currentPrice(auction, bids);
      const leaderId = bids.length ? bids[0].bidder_id : auction.highest_bidder_id;
      const leading = profile && leaderId === profile.id;
      let action;

      if (!isOpen(auction)) {
        action = `<button class="btn btn-block" disabled>Auction closed</button>`;
      } else if (!profile) {
        action = `<a class="btn btn-primary btn-block" href="login.html?next=${encodeURIComponent('auction.html?id=' + auction.id)}">Log in to bid</a>`;
      } else if (profile.role !== 'bidder') {
        action = `<button class="btn btn-block" disabled>Only bidders can place bids</button>`;
      } else {
        action = `<button class="btn btn-primary btn-block" id="open-bid">Place bid</button>`;
      }

      return `
        <aside class="panel">
          <small class="muted">${price > 0 ? 'Current highest bid' : 'Starting price'}</small>
          <p class="big-bid">${formatNZD(price > 0 ? price : auction.starting_price)}</p>
          <p class="countdown" data-end="${esc(auction.end_time)}">${countdownText(auction.end_time)}</p>
          <p class="bid-note ${leading ? 'lead' : ''}">
            ${leading ? 'You are the highest bidder' : `${bids.length} bid${bids.length === 1 ? '' : 's'} so far`}
          </p>
          ${action}
        </aside>`;
    }

    // list of bids. other bidders are shown as a number, not by name
    function historyTable() {
      if (!bids.length) return '<p class="state">No bids yet. Be the first.</p>';
      return `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Bidder</th><th>Amount</th><th>Time</th></tr></thead>
            <tbody>
              ${bids.map((b, i) => {
                const me = profile && b.bidder_id === profile.id;
                return `<tr>
                  <td data-label="Bidder" class="${me ? 'history-me' : ''}">${me ? 'You' : 'Bidder #' + (bids.length - i)}</td>
                  <td data-label="Amount">${formatNZD(b.amount)}</td>
                  <td data-label="Time">${new Date(b.created_at).toLocaleString('en-NZ')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }

    // get the auction, its bids and the user, then draw the page
    async function load() {
      if (!id) {
        content.innerHTML = '<p class="state error">No auction selected.</p>';
        return;
      }
      try {
        [auction, bids, profile] = await Promise.all([getAuction(id), getBids(id), getProfile()]);
        const status = shownStatus(auction);
        document.title = `${countryLabel(auction.country_name)} | GlobalPass`;
        content.innerHTML = `
          <div class="detail">
            <section class="panel">
              <img class="detail-img" src="${esc(flagUrl(auction.country_name))}" alt="Flag of ${esc(countryLabel(auction.country_name))}" data-flag>
              <div class="detail-title">
                <h1>${esc(countryLabel(auction.country_name))} citizenship</h1>
                <span class="badge badge-${esc(status)}">${esc(status)}</span>
              </div>
              <div class="facts">
                <div><small>Starting price</small><strong>${formatNZD(auction.starting_price)}</strong></div>
                <div><small>Total bids</small><strong>${bids.length}</strong></div>
                <div><small>Ends</small><strong>${new Date(auction.end_time).toLocaleString('en-NZ')}</strong></div>
                <div><small>Status</small><strong style="text-transform:capitalize">${esc(status)}</strong></div>
              </div>
            </section>
            ${bidPanel()}
          </div>
          <div class="section-head" style="margin-top:32px"><h2>Bid history</h2></div>
          ${historyTable()}`;
        document.getElementById('open-bid')?.addEventListener('click', openModal);

        // flash the price when it changed since the last load
        const price = currentPrice(auction, bids);
        if (lastPrice !== null && price !== lastPrice) flash(document.querySelector('.big-bid'));
        lastPrice = price;

        // if the popup is open and someone else bid, raise the minimum
        if (modal.open) {
          const min = minNextBid(auction, bids);
          document.getElementById('bid-min').textContent = `Minimum bid: ${formatNZD(min)}`;
          amountInput.min = min;
          if (!isOpen(auction)) showBidMsg('This auction has just closed.');
        }
      } catch (err) {
        console.error(err);
        content.innerHTML = '<p class="state error">Auction not found or could not be loaded.</p>';
      }
    }

    function openModal() {
      const min = minNextBid(auction, bids);
      document.getElementById('bid-min').textContent = `Minimum bid: ${formatNZD(min)}`;
      amountInput.min = min;
      amountInput.value = min;
      bidMsg.textContent = '';
      document.getElementById('quick').innerHTML = [100, 500, 1000]
        .map((n) => `<button type="button" class="btn btn-ghost" data-add="${n}">+${formatNZD(n)}</button>`)
        .join('');
      modal.showModal();
      amountInput.focus();
    }

    // quick buttons add to the amount
    document.getElementById('quick').addEventListener('click', (e) => {
      const add = e.target.closest('[data-add]')?.dataset.add;
      if (add) amountInput.value = Math.max(Number(amountInput.value) || 0, minNextBid(auction, bids)) + Number(add);
    });

    document.getElementById('bid-cancel').addEventListener('click', () => modal.close());

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const amount = Number(amountInput.value);
      const min = minNextBid(auction, bids);

      // check on the page first, the database checks again when saving
      if (!isOpen(auction)) return showBidMsg('This auction has closed.');
      if (!Number.isFinite(amount) || amount < min) return showBidMsg(`Bid must be at least ${formatNZD(min)}.`);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Placing bid...';
      try {
        await placeBid(auction.id, profile.id, amount);
        showBidMsg('Bid placed!', true);
        setTimeout(() => modal.close(), 700);
        await load();
      } catch (err) {
        console.error(err);
        showBidMsg(err.message || 'Bid failed. Please try again.');
        await load();
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm bid';
      }
    });

    function showBidMsg(text, ok = false) {
      bidMsg.textContent = text;
      bidMsg.className = 'form-msg ' + (ok ? 'ok' : 'error');
    }

    await load();
    startCountdowns();
    // live updates, plus a slow refresh in case the live connection drops
    if (id) subscribeAuction(id, load);
    setInterval(load, 30000);
  </script>
</body>
</html>
