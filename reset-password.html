<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New password | GlobalPass</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a href="index.html" class="logo">Global<span>Pass</span></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main class="container section">
    <form class="form-card" id="reset-form" novalidate>
      <h1>Set a new password</h1>
      <p class="form-sub">Open this page from the link in your email.</p>

      <label for="password">New password <small>(min 6 characters)</small></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

      <label for="confirm">Repeat new password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required>

      <p class="form-msg" id="msg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Save password</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 GlobalPass · All rights reserved A &amp; S · <a href="about.html">About &amp; contact</a></div>
  </footer>

  <script type="module">
    import './js/ui.js';
    import { updateUserPassword } from './database--seb/password.js';

    const form = document.getElementById('reset-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    function show(text, ok = false) {
      msg.textContent = text;
      msg.className = 'form-msg ' + (ok ? 'ok' : 'error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = form.password.value;
      if (password.length < 6) return show('Password must be at least 6 characters.');
      if (password !== form.confirm.value) return show('The two passwords are not the same.');

      btn.disabled = true;
      btn.textContent = 'Saving...';
      const result = await updateUserPassword(password);
      btn.disabled = false;
      btn.textContent = 'Save password';

      if (!result.success) return show(result.error);
      show('Password saved. Taking you to log in...', true);
      setTimeout(() => (window.location.href = 'login.html'), 1200);
    });
  </script>
</body>
</html>
