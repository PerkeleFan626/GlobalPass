<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create auction | GlobalPass</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a href="index.html" class="logo">Global<span>Pass</span></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main class="container section" id="page" hidden>
    <form class="form-card create-card" id="auction-form" novalidate>
      <h1>Create an auction</h1>
      <p class="form-sub">Bidding opens as soon as you create it and closes at the end time.</p>

      <label for="country">Country</label>
      <div class="country-row">
        <img class="flag-preview" id="flag-preview" src="images/placeholder.svg" alt="" data-flag>
        <input id="country" name="country" type="text" maxlength="80" autocomplete="off" list="country-list" placeholder="Start typing, then pick from the list" required>
      </div>
      <datalist id="country-list"></datalist>
      <p class="field-msg" id="country-msg"></p>

      <label for="price">Starting price (NZD)</label>
      <input id="price" name="price" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 50000" required>

      <label for="end">Auction ends</label>
      <input id="end" name="end" type="datetime-local" required>
      <div class="quick" id="quick-end">
        <button type="button" class="btn btn-ghost" data-days="1">1 day</button>
        <button type="button" class="btn btn-ghost" data-days="3">3 days</button>
        <button type="button" class="btn btn-ghost" data-days="7">1 week</button>
      </div>

      <p class="form-msg" id="msg" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Create auction</button>
    </form>

    <div class="section-head" style="margin-top:48px"><h2>My listings</h2></div>
    <div class="grid" id="mine"><div class="skeleton"></div></div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 GlobalPass · All rights reserved A &amp; S · <a href="about.html">About</a> · <a href="contact.html">Contact</a></div>
  </footer>

  <script type="module">
    import { createAuction, getMyAuctions, cancelMyAuction, isOpen } from './js/api.js';
    import { requireRole } from './js/auth.js';
    import { auctionCard, startCountdowns } from './js/ui.js';
    import { flagUrl, countryLabel, checkCountry, fillCountryList, PLACEHOLDER_IMAGE } from './js/countries.js';

    // only government users can open this page
    const profile = await requireRole(['government']);
    if (profile) init(profile);

    function init(profile) {
      document.getElementById('page').hidden = false;
      const form = document.getElementById('auction-form');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit');
      const end = document.getElementById('end');
      const country = document.getElementById('country');
      const countryMsg = document.getElementById('country-msg');
      const flag = document.getElementById('flag-preview');

      fillCountryList('country-list');

      // the date box wants local time written as yyyy-mm-ddThh:mm
      const pad = (n) => String(n).padStart(2, '0');
      const toLocalInput = (d) =>
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

      // the end time has to be at least 5 minutes from now
      end.min = toLocalInput(new Date(Date.now() + 5 * 60 * 1000));

      // quick buttons set the end time to 1 day, 3 days or 1 week from now
      document.getElementById('quick-end').addEventListener('click', (e) => {
        const days = e.target.closest('[data-days]')?.dataset.days;
        if (days) end.value = toLocalInput(new Date(Date.now() + days * 86400000));
      });

      // check the country while typing and show its flag (backend check and flags)
      function updateCountry() {
        const value = country.value.trim();
        if (!value) {
          flag.src = PLACEHOLDER_IMAGE;
          countryMsg.textContent = '';
          countryMsg.className = 'field-msg';
          return false;
        }
        const check = checkCountry(value);
        flag.src = check.success ? flagUrl(check.country) : PLACEHOLDER_IMAGE;
        flag.alt = check.success ? `Flag of ${countryLabel(check.country)}` : '';
        countryMsg.textContent = check.success ? '' : 'Pick a country from the list.';
        countryMsg.className = 'field-msg' + (check.success ? '' : ' error');
        return check.success;
      }
      country.addEventListener('input', updateCountry);

      // start with the country this account represents
      function resetForm() {
        form.reset();
        country.value = profile.represented_country ? countryLabel(profile.represented_country) : '';
        updateCountry();
      }

      function show(text, ok = false) {
        msg.textContent = text;
        msg.className = 'form-msg ' + (ok ? 'ok' : 'error');
      }

      async function loadMine() {
        const box = document.getElementById('mine');
        try {
          const auctions = await getMyAuctions(profile.id);
          box.innerHTML = auctions.length
            ? auctions.map(auctionCard).join('')
            : '<p class="state">You have no listings yet. Create your first one above.</p>';

          // open auctions get a cancel button under the card
          auctions.filter(isOpen).forEach((a) => {
            const body = box.querySelector(`.card[data-id="${a.id}"] .card-body`);
            if (!body) return;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-danger';
            btn.dataset.cancel = a.id;
            btn.textContent = 'Cancel auction';
            body.appendChild(btn);
          });
        } catch (err) {
          console.error(err);
          box.innerHTML = '<p class="state error">Could not load your listings.</p>';
        }
      }

      // cancel needs a second click so it is not done by mistake
      document.getElementById('mine').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-cancel]');
        if (!btn) return;
        if (btn.dataset.armed !== 'true') {
          btn.dataset.armed = 'true';
          btn.textContent = 'Click again to cancel';
          setTimeout(() => {
            if (!btn.disabled) { btn.dataset.armed = ''; btn.textContent = 'Cancel auction'; }
          }, 3000);
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Cancelling...';

        // backend function: only cancels your own auction while it is still active
        const result = await cancelMyAuction(btn.dataset.cancel);
        if (!result.success) {
          show('Could not cancel: ' + (result.error || 'please try again.'));
          btn.disabled = false;
          btn.dataset.armed = '';
          btn.textContent = 'Cancel auction';
          return;
        }
        show('Auction cancelled.', true);
        loadMine();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const price = Number(form.price.value);
        const endTime = new Date(form.end.value);

        // check on the page first, then the backend checks again
        if (!updateCountry()) return show('Pick a country from the list.');
        if (!price || price < 1) return show('Starting price must be at least $1.');
        if (!form.end.value || isNaN(endTime)) return show('Choose when the auction ends.');
        if (endTime <= new Date()) return show('End time must be in the future.');

        btn.disabled = true;
        btn.textContent = 'Creating...';

        // backend function: checks the role, the country and the price, then saves it
        const result = await createAuction({
          country_name: country.value.trim(),
          starting_price: price,
          end_time: endTime.toISOString(),
        });

        btn.disabled = false;
        btn.textContent = 'Create auction';

        if (!result.success) return show('Could not create auction: ' + (result.error || 'please try again.'));

        const id = result.auction?.id;
        msg.innerHTML = `Auction created!${id ? ` <a href="auction.html?id=${encodeURIComponent(id)}">View it</a>` : ''}`;
        msg.className = 'form-msg ok';
        resetForm();
        loadMine();
      });

      resetForm();
      loadMine();
      startCountdowns();
    }
  </script>
</body>
</html>
